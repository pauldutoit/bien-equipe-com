<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Manrope:wght@800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, sans-serif; color: #fff;
    background: radial-gradient(circle at 85% 20%, rgba(59,91,255,.55), transparent 45%), linear-gradient(150deg, #1b1f4d 0%, #2b3170 100%); }
  .wrap { padding: 72px 80px; height: 100%; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 40px; }
  h1 { font-family: Manrope, sans-serif; font-weight: 800; font-size: 66px; line-height: 1.08; letter-spacing: -0.02em; margin-top: 64px; max-width: 900px; }
  p { margin-top: 26px; font-size: 28px; color: #d4dbff; max-width: 860px; line-height: 1.35; }
  .foot { margin-top: auto; display: flex; gap: 14px; }
  .pill { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 99px; padding: 10px 20px; font-size: 22px; font-weight: 600; }
  .pill.y { background: #ffd23f; color: #1b1f4d; border: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg width="64" height="64" viewBox="0 0 42 42"><rect width="42" height="42" rx="12" fill="#3b5bff"/><g transform="translate(6 6)"><path d="M4.5 20 A10.5 10.5 0 0 1 25.5 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M15 20 L21.5 11.5" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><circle cx="15" cy="20" r="2.6" fill="#fff"/><path d="M8 25.5 H22" stroke="#fff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/></g></svg>
      Bien Équipé
    </div>
    <h1>Le bon frigo, c'est d'abord celui qui rentre.</h1>
    <p>Réfrigérateurs comparés sur les données officielles de l'étiquette énergie européenne.</p>
    <div class="foot">
      <span class="pill y">Données EPREL</span>
      <span class="pill">Calculateur de dimensions</span>
      <span class="pill">Aucun emplacement payé</span>
    </div>
  </div>
</body>
</html>
